name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  DATABASE_URL: postgresql://ci_user:ci_password@127.0.0.1:5432/smart_elearning_ci?schema=public
  SHADOW_DATABASE_URL: postgresql://ci_user:ci_password@127.0.0.1:5432/smart_elearning_ci_shadow?schema=public
  SESSION_SECRET: ci-only-session-secret-not-for-production

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: smart_elearning_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d smart_elearning_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - name: Install npm 12.0.2
        run: npm install --global npm@12.0.2
      - name: Verify tooling
        run: |
          node --version
          npm --version
      - run: npm ci
      - name: Generate Prisma Client
        run: npm run prisma:generate
      - name: Apply Prisma migrations
        run: npm run prisma:migrate:deploy
      - run: npm run check:skeleton
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - name: Run API E2E tests
        run: npm run test:e2e -w @smart-elearning/api
      - run: npm run build
